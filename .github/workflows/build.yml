name: Build package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      # ROCm (rocm-llvm, rocblas, ...) needs far more disk than a stock runner has free.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - name: Read package version
        id: ver
        run: |
          source PKGBUILD
          echo "tag=${pkgver}-${pkgrel}" >> "$GITHUB_OUTPUT"
          echo "name=${pkgname}" >> "$GITHUB_OUTPUT"

      - name: Build in Arch Linux container
        run: |
          docker run --rm -v "$PWD:/pkg" archlinux:base-devel bash -euxo pipefail -c '
            pacman -Syu --noconfirm --needed git namcap
            useradd -m builder
            echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
            chown -R builder:builder /pkg
            cd /pkg
            sudo -u builder makepkg --syncdeps --noconfirm --cleanbuild
            namcap ./*.pkg.tar.zst || true
            chown -R '"$(id -u):$(id -g)"' /pkg
          '
          ls -la ./*.pkg.tar.zst

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.name }} ${{ steps.ver.outputs.tag }}
          make_latest: true
          files: ./*.pkg.tar.zst
          body: |
            llama.cpp from ggml-org/llama.cpp#30306 (NVIDIA Dory support), built for ROCm gfx1031 + Vulkan.
            Install: `sudo pacman -U ${{ steps.ver.outputs.name }}-*.pkg.tar.zst`
