; llama-server router presets. Every *.gguf in /opt/models is listed
; automatically; add a [section] named after a model only to tune it.
; Keys are llama-server CLI flags without the leading dashes.
version = 1

[*]
ngl = 999
jinja = true

; NVIDIA Nemotron-Labs Dory 1.0 4B (needs llama.cpp PR #30306).
; 4 loops with the last-loop KV cache: ~36 KiB of KV per token, so 32K
; context stays around 5-6 GB of VRAM. per_loop with 4 loops is ~96 KiB/token.
[NVIDIA-Nemotron-Labs-Dory1.0-4B-Q5_K_M]
c = 32768
parallel = 1
batch-size = 512
ubatch-size = 512
cache-type-k = f16
cache-type-v = f16
flash-attn = off
context-shift = false
reasoning = on
temp = 1.0
top-p = 0.95
top-k = 0
min-p = 0
repeat-penalty = 1
override-kv = dory.num_loops=int:4,dory.recurrent_kv_cache_mode=str:last_loop
