# Extra arguments for llama-server (router mode).
# Host, port, --models-dir and --models-preset are set in llama.cpp.service.
# Per-model settings (context size, sampling, Dory loops) live in
# /etc/llama.cpp/models.ini. Arguments here override the preset file, so
# avoid setting --ctx-size here if you want per-model context sizes.
LLAMA_ARGS="--models-max 1 --sleep-idle-seconds 300"
